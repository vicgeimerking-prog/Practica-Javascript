<!DOCTYPE html> <!-- Indica que el documento utiliza HTML5 -->

<html lang="es"> <!-- Inicio del documento HTML -->

<head> <!-- Cabecera del documento -->
    <meta charset="UTF-8"> <!-- Permite caracteres especiales -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adaptación a dispositivos móviles -->
    <title>Práctica 7 | JavaScript</title>
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos1.css">
    <!-- Vincula la hoja de estilos CSS -->
</head>

<body>

    <!-- Encabezado -->
    <header>
        <!-- Logo (calavera en SVG) -->
        <svg class="logo" viewBox="0 0 64 64" aria-label="Logo">
            <path d="M32 6C18 6 9 15.5 9 28c0 7 3 12 8 15v8c0 2 1.5 3.5 3.5 3.5H24v-5h4v5h8v-5h4v5h3.5c2 0 3.5-1.5 3.5-3.5v-8c5-3 8-8 8-15C55 15.5 46 6 32 6z" fill="currentColor"/>
            <circle cx="23" cy="29" r="6" fill="#0b0b0f"/>
            <circle cx="41" cy="29" r="6" fill="#0b0b0f"/>
            <path d="M32 36l-3.5 6h7z" fill="#0b0b0f"/>
        </svg>
        <h1 id="titulo">PRÁCTICA_07 // JAVASCRIPT</h1>
        <p class="subtitulo">Introducción a las aplicaciones web</p>
    </header>

    <!-- Menú de navegación -->
    <nav id="menu">
        <ul>
            <li>Inicio</li>
            <li>Servicios</li>
            <li>Productos</li>
            <li>Contacto</li>
        </ul>
    </nav>

    <!-- Sección de imagen -->
    <section>
        <img id="imagen" src="imagenes/imagen1.png" alt="Imagen de la práctica">
    </section>

    <!-- Sección de eventos -->
    <section>
        <h2>Eventos de JavaScript</h2>
        <div class="botones">
            <button id="btnTitulo">Cambiar encabezado</button>
            <button id="btnColor">Cambiar color de fondo</button>
            <button id="btnMenu">Mostrar / Ocultar menú</button>
            <button id="btnImagen">Cambiar imagen</button>
        </div>
    </section>

    <!-- Sección del formulario -->
    <section>
        <h2>Registro al Hackathon</h2>

        <form id="formulario" novalidate>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" placeholder="Escribe tu nombre">

            <label for="email">Correo:</label>
            <input type="email" id="email" placeholder="tucorreo@ejemplo.com">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="••••••••">

            <label for="date">Fecha de nacimiento:</label>
            <input type="date" id="date">

            <label for="rol">Área de interés:</label>
            <select id="rol">
                <option value="">-- Selecciona una opción --</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Full Stack">Full Stack</option>
                <option value="Ciberseguridad">Ciberseguridad</option>
            </select>

            <label class="check">
                <input type="checkbox" id="checkbox">
                Acepto términos y condiciones
            </label>

            <input type="submit" value="Registrarme">
        </form>

        <!-- Mensaje mostrado por JavaScript -->
        <div id="mensaje"></div>
    </section>

    <!-- Pie de página -->
    <footer>
        <p>© 2026 Victor Galicia · Todos los derechos reservados</p>
    </footer>

    <!-- Vincula el archivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
